name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTEST_RUN_WITNESS_TEST_TMP: ${{ runner.temp }}/pytest-run-witness-test-temp

  pytest-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install --force-reinstall "pytest==7.1.3" "pytest-xdist==3.6.1"
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTEST_RUN_WITNESS_TEST_TMP: ${{ runner.temp }}/pytest-run-witness-floor-temp

  pytest-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install --upgrade "pytest==9.1.1"
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTEST_RUN_WITNESS_TEST_TMP: ${{ runner.temp }}/pytest-run-witness-current-temp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "build==1.5.0" "twine==7.0.0"
      - run: python -m build
      - run: python -m twine check dist/*

  hosted-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - name: Produce normal, false-green, and xdist receipts
        run: python scripts/hosted_probe.py produce --output hosted-evidence
      - name: Upload run-bound receipts for independent verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-run-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-evidence/
          if-no-files-found: error

  hosted-verifier:
    if: always()
    needs: hosted-producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      - name: Download evidence without trusting the producer job conclusion
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pytest-run-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-evidence
      - name: Verify each receipt and expected fail-closed case
        if: always()
        run: python scripts/hosted_probe.py verify --input hosted-evidence

  ci-gate:
    if: always()
    needs:
      - compatibility
      - pytest-floor
      - pytest-current
      - package
      - hosted-producer
      - hosted-verifier
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to succeed
        run: |
          for result in \
            "${{ needs.compatibility.result }}" \
            "${{ needs.pytest-floor.result }}" \
            "${{ needs.pytest-current.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.hosted-producer.result }}" \
            "${{ needs.hosted-verifier.result }}"
          do
            test "$result" = "success"
          done
